name: Generate data

on:
  schedule:
    - cron: "30 2 * * *"
      timezone: "Europe/Moscow"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_lists:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bgpq4
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Pull Changes
        run: git pull
      - name: Download and install Mihomo
        run: |
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -L https://github.com/MetaCubeX/mihomo/releases/download/v1.19.9/mihomo-linux-amd64-v1.19.9.gz -o ./mihomo.gz
          gunzip -c ./mihomo.gz > ./mihomo
          chmod +x ./mihomo
      - name: Generate services lists
        env:
          NO_SKIP: true
        run: python update_services_list.py
      - name: Generate bypass lists
        env:
          NO_SKIP: true
        run: python update_block_list.py
      - name: Generate spyware lists
        env:
          NO_SKIP: true
        run: python update_badware_list.py
      - name: Generate ads lists
        env:
          NO_SKIP: true
        run: python update_ads_list.py
      - name: Generate subnet lists
        env:
          NO_SKIP: true
        run: python update_subnets_list.py
      - name: Update readme
        env:
          NO_SKIP: true
        run: python update_readme.py
      - name: Update JustClash lists
        env:
          NO_SKIP: true
        run: python update_justclash_lists.py
      - name: Cleanup
        env:
          NO_SKIP: true
        run: |
          rm -f ./mihomo
          rm -f ./mihomo.gz
      - name: Get current date
        id: date
        run: |
          echo "DATE=$(TZ=Europe/Moscow date +'%Y-%m-%dT%H:%M:%S')"  >> $GITHUB_ENV
      - name: Commit and Push Changes
        run: |
          git config --local user.email "1570693+SaltyMonkey@users.noreply.github.com"
          git config --local user.name "SaltyMonkey"
          git add .
          git commit -m "Generating lists for domains and subnets ${{ env.DATE }}" -a || echo "No changes to commit"
          git push
